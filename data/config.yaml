version: 1
dns:
  listen: ":15353"
  listens:
    - ":15353"
  upstreams:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
  upstream_mode: "load_balance"
  fallback_upstreams: []
  local_records: []
  bootstrap_dns:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
  upstream_timeout_seconds: 4
  blocking_mode: "nxdomain"
  blocking_ipv4: "0.0.0.0"
  blocking_ipv6: "::"
  enable_dnssec: false
  dnssec_validate: false
  dnssec_trust_anchors: []
  dnssec_trust_anchor_file: ""
  dnssec_auto_update: false
  blocked_response_ttl: 10
web:
  listen: "127.0.0.1:18080"
cache:
  enabled: true
  size: 4194304
  ttl_min: 0
  ttl_max: 0
  optimistic: false
  optimistic_answer_ttl: 30
  optimistic_max_age: 43200
rules:
  local_file: "data/rules.txt"
logging:
  query_log_size: 200
  enabled: false
  file: "data/querylog"
  retention_days: 7
access:
  allowed_clients: []
  denied_clients: []
  client_rate_limit_qps: 0
  max_concurrent_queries: 2048
  rebinding_protection: false
  rebinding_allow_domains: []
encryption:
  enabled: false
  certificate: ""
  private_key: ""
  certificate_pem: ""
  private_key_pem: ""
  dot_listen: ""
  dot_listens: []
  doh_listen: ""
  doh_listens: []
  doh3_listen: ""
  doh3_listens: []
  doq_listen: ""
  doq_listens: []
  dnscrypt:
    enabled: false
    listen: ""
    listens: []
    provider_name: "dnsentry"
    private_key: ""
    resolver_secret: ""
    certificate_ttl_hours: 24
